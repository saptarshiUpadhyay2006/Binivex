<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0052D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4364F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6FB1FC;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92FE9D;stop-opacity:1" />
    </linearGradient>
    
    <style>
      .brand-text {
        font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        font-size: 85px;
        font-weight: 800;
        /* UPDATED: Changed to White for contrast on gray background */
        fill: #FFFFFF; 
        letter-spacing: -2px;
      }
      .brand-accent {
        fill: url(#accentGrad);
      }
      .tagline {
        font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        font-size: 14px;
        font-weight: 600;
        /* UPDATED: Changed to very light gray for readability */
        fill: #DDE1E6;
        letter-spacing: 5.5px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <g transform="translate(30, 25)">
    <path d="M70,5 L130,40 L130,110 L70,145 L10,110 L10,40 Z" fill="none" stroke="url(#iconGrad)" stroke-width="12" stroke-linejoin="round"/>

    <path d="M40,100 L70,70 L90,90 L120,45" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="40" cy="100" r="7" fill="#FFFFFF"/>
    <circle cx="70" cy="70" r="7" fill="#FFFFFF"/>
    <circle cx="90" cy="90" r="7" fill="#FFFFFF"/>
    <circle cx="120" cy="45" r="7" fill="#FFFFFF"/>
  </g>

  <text x="200" y="115" class="brand-text">bini<tspan class="brand-accent">vex</tspan></text>
  <text x="205" y="150" class="tagline">Predictive Intelligence</text>
</svg>